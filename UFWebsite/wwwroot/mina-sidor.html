<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina sidor | Ticshare UF</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="css/mina-sidor.css">

    <script src="js/api.js" defer></script>
    <script src="js/mina-sidor.js" defer></script>
</head>
<body>
    <p><a href="index.html">← Startsidan</a></p>
    <h1>Hej <span id="namn"></span>!</h1>
    <button id="logga-ut">Logga ut</button>

    <h2>Mina köp</h2>
    <div id="kop"></div>

    <h2>Mina försäljningar</h2>
    <div id="forsaljningar"></div>

    <h2>Sälj en biljett</h2>
    <form id="salj-form">
        <label>Säsongskort <select id="salj-kort" required></select></label>
        <label>Match <select id="salj-match" required></select></label>
        <label>Ordinarie pris (kr) <input id="salj-ordinarie" type="number" min="1" required></label>
        <label>Ditt pris (kr) <input id="salj-pris" type="number" min="1" required></label>
        <button>Skicka för granskning</button>
        <p id="salj-meddelande"></p>
    </form>

    <h2>Mina säsongskort</h2>
    <div id="kort"></div>
    <form id="kort-form">
        <label>Klubb <select id="kort-klubb" required></select></label>
        <label>Säsong <input id="kort-sasong" value="2026" required></label>
        <label>Säsongskortets ID <input id="kort-nummer" required></label>
        <label>Sektion <input id="kort-sektion" required></label>
        <label>Rad <input id="kort-rad" required></label>
        <label>Plats <input id="kort-plats" required></label>
        <label><input id="kort-villkor" type="checkbox" required> Jag intygar att kortet är mitt och att klubbens regler tillåter att jag säljer vidare enskilda matcher.</label>
        <button>Skicka kortet för verifiering</button>
        <p id="kort-meddelande"></p>
    </form>

    <h2>Utbetalning</h2>
    <form id="swish-form">
        <label>Ditt Swish-nummer <input id="swish" required></label>
        <button>Spara</button>
    </form>

    <h2>Konto</h2>
    <button id="radera">Radera mitt konto</button>
</body>
</html>
